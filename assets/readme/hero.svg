<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="tm-title tm-desc">
  <title id="tm-title">TokenMaster — 多 Provider 本地 OpenAI 协议网关</title>
  <desc id="tm-desc">TokenMaster 把 15 家 AI 编程服务的账号聚合为运行在本机回环地址上的 OpenAI 协议兼容网关：客户端凭网关密钥接入，网关按模型名路由到各 Provider 的令牌池，失败自动换号、限流自动冷却。</desc>

  <defs>
    <marker id="tm-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- 画布 -->
  <rect width="1200" height="500" rx="14" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="1199" height="499" rx="14" fill="none" stroke="#30363d"/>

  <!-- 标题区 -->
  <g id="title-block">
    <text x="64" y="78" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" letter-spacing="3" fill="#8b949e">WINDOWS 桌面客户端 · 设计阶段</text>
    <rect x="874" y="54" width="262" height="32" rx="16" fill="#3fb950" fill-opacity="0.08" stroke="#3fb950" stroke-opacity="0.5"/>
    <text x="1005" y="75" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#3fb950">v1 规格 · ready-for-agent</text>
    <text x="64" y="142" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="64" font-weight="800" fill="#f0f6fc">TokenMaster</text>
    <text x="64" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="25" fill="#e6edf3">把 15 家 AI 编程服务的账号，聚合为一个本地 OpenAI 协议兼容网关。</text>
    <text x="64" y="212" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" fill="#8b949e">任何支持自定义 base_url 的客户端 —— 一个地址、一把密钥、消费全部额度。</text>
  </g>

  <!-- 客户端 -->
  <g id="clients">
    <rect x="56" y="248" width="230" height="136" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="72" y="276" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="16" fill="#8b949e">AI 编程客户端</text>
    <rect x="72" y="288" width="140" height="24" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="142" y="305" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#c9d1d9">Claude Code</text>
    <rect x="72" y="318" width="74" height="24" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="109" y="335" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#c9d1d9">Cline</text>
    <rect x="72" y="348" width="118" height="24" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="131" y="365" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#c9d1d9">Codex CLI</text>
  </g>

  <line x1="290" y1="316" x2="306" y2="316" stroke="#8b949e" stroke-width="1.6" marker-end="url(#tm-arr)"/>

  <!-- 网关 -->
  <g id="gateway">
    <rect x="316" y="248" width="390" height="136" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="332" y="276" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#58a6ff">本地网关 · 单端口 · 双协议</text>
    <rect x="616" y="260" width="74" height="22" rx="11" fill="#21262d" stroke="#30363d"/>
    <text x="653" y="275" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#8b949e">sk-••••</text>
    <text x="332" y="308" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#c9d1d9">POST /v1/chat/completions<tspan fill="#3fb950"> · SSE</tspan></text>
    <text x="332" y="334" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#c9d1d9">POST /v1/messages<tspan fill="#8b949e"> · Anthropic</tspan></text>
    <text x="332" y="360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" fill="#c9d1d9">模型名路由 · 裸名映射 / 前缀强制指定</text>
  </g>

  <line x1="710" y1="316" x2="726" y2="316" stroke="#8b949e" stroke-width="1.6" marker-end="url(#tm-arr)"/>

  <!-- 令牌池 -->
  <g id="pool">
    <rect x="736" y="248" width="400" height="136" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="752" y="276" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#3fb950">令牌池<tspan font-weight="400" font-size="16" fill="#8b949e"> · 自动换号 · 限流冷却</tspan></text>
    <rect x="752" y="296" width="20" height="20" rx="4" fill="#3fb950"/>
    <rect x="780" y="296" width="20" height="20" rx="4" fill="#3fb950"/>
    <rect x="808" y="296" width="20" height="20" rx="4" fill="#d29922"/>
    <rect x="836" y="296" width="20" height="20" rx="4" fill="#3fb950"/>
    <rect x="864" y="296" width="20" height="20" rx="4" fill="#3fb950"/>
    <rect x="892" y="296" width="20" height="20" rx="4" fill="#30363d"/>
    <rect x="752" y="324" width="20" height="20" rx="4" fill="#3fb950"/>
    <rect x="780" y="324" width="20" height="20" rx="4" fill="#f85149"/>
    <rect x="808" y="324" width="20" height="20" rx="4" fill="#3fb950"/>
    <rect x="836" y="324" width="20" height="20" rx="4" fill="#d29922"/>
    <rect x="864" y="324" width="20" height="20" rx="4" fill="#3fb950"/>
    <rect x="892" y="324" width="20" height="20" rx="4" fill="#3fb950"/>
    <text x="948" y="311" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#c9d1d9"><tspan fill="#f85149">401</tspan> → 换号重试</text>
    <text x="948" y="337" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#c9d1d9"><tspan fill="#d29922">429</tspan> → 冷却后换号</text>
    <text x="948" y="363" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="17" fill="#8b949e">临期积分优先消耗</text>
  </g>

  <line x1="936" y1="388" x2="936" y2="406" stroke="#30363d" stroke-width="1.4" stroke-dasharray="3 4"/>

  <!-- 上游 Provider -->
  <g id="providers">
    <text x="56" y="406" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" letter-spacing="2" fill="#8b949e">上游 · 15 家 PROVIDER</text>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#c9d1d9">
      <rect x="56" y="416" width="106" height="24" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="109" y="432" text-anchor="middle">codearts</text>
      <rect x="172" y="416" width="74" height="24" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="209" y="432" text-anchor="middle">buddy</text>
      <rect x="256" y="416" width="117" height="24" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="314" y="432" text-anchor="middle">workbuddy</text>
      <rect x="383" y="416" width="117" height="24" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="441" y="432" text-anchor="middle">lobsterai</text>
      <rect x="510" y="416" width="74" height="24" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="547" y="432" text-anchor="middle">qoder</text>
      <rect x="594" y="416" width="96" height="24" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="642" y="432" text-anchor="middle">qodercn</text>
      <rect x="700" y="416" width="63" height="24" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="731" y="432" text-anchor="middle">trae</text>
      <rect x="773" y="416" width="74" height="24" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="810" y="432" text-anchor="middle">cline</text>

      <rect x="56" y="448" width="74" height="24" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="93" y="464" text-anchor="middle">loomy</text>
      <rect x="140" y="448" width="96" height="24" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="188" y="464" text-anchor="middle">raccoon</text>
      <rect x="246" y="448" width="96" height="24" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="294" y="464" text-anchor="middle">minimax</text>
      <rect x="352" y="448" width="74" height="24" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="389" y="464" text-anchor="middle">zcode</text>
      <rect x="436" y="448" width="106" height="24" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="489" y="464" text-anchor="middle">opencode</text>
      <rect x="552" y="448" width="85" height="24" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="594" y="464" text-anchor="middle">gemini</text>
      <rect x="647" y="448" width="139" height="24" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="716" y="464" text-anchor="middle">commandcode</text>
    </g>
  </g>
</svg>
